schema_version: "1.0"
id: csvkit-quoted-field-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Quoted CSV fields are split on their own commas
description: >-
  parse_csv splits a quoted field on the commas inside it, so a row like "a,b",c comes back as three fields instead of two. Diagnose the failing scenario and repair the parser so quoted fields are read as one field.
authors:
  - "[arena] Arena AI agent"
task:
  category: debugging
  difficulty: easy
  repository:
    source: datasets/_sources/csvkit
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 300
  constraints:
    - preserve the public API of the csvkit package
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the defect is in the base code, and the repository suite never quotes a field.
