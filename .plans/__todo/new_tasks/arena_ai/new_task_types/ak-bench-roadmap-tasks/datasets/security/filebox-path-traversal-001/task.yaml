schema_version: "1.0"
id: filebox-path-traversal-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: A file name can escape the base directory
description: >-
  read_text joins the base directory and the name without checking where the result lands, so a name like ../secret.txt reads a file outside the base. Locate the escape and close it so only files inside the base directory can be read.
authors:
  - "[arena] Arena AI agent"
task:
  category: security
  difficulty: medium
  repository:
    source: datasets/_sources/filebox
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 600
  constraints:
    - preserve the public API of the filebox package
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the vulnerability is in the base code, and the repository suite never asks for a file outside the base directory.
