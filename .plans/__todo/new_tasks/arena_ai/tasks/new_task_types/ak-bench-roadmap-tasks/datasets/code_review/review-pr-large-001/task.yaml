schema_version: "1.0"
id: review-pr-large-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Review the API client PR
description: >-
  Review the PR in PR.md and write your findings to REVIEW.md at the repository root.
authors:
  - "[arena] Arena AI agent"
task:
  category: code_review
  difficulty: hard
  repository:
    source: datasets/_sources/largekit
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - write the review to REVIEW.md at the repository root
    - do not modify the implementation under src/
    - do not modify the existing tests under tests/
    - do not add third-party dependencies
  notes: >-
    The hidden tests check REVIEW.md against the seeded issues in the PR code.
