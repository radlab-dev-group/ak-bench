schema_version: "1.0"
id: authkit-token-reuse-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Logged-out and expired sessions still validate
description: >-
  SessionStore.validate accepts tokens after logout and long after expiry, so a stolen token stays valid forever. Locate both flaws and close them so logout ends the session immediately and expired sessions are refused.
authors:
  - "[arena] Arena AI agent"
task:
  category: security
  difficulty: expert
  repository:
    source: datasets/_sources/authkit
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1800
  constraints:
    - preserve the public API of the authkit package
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the vulnerabilities are in the base code, and the repository suite only validates fresh sessions.
