schema_version: "1.0"
id: configkit-unsafe-load-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Loading a config can execute code embedded in it
description: >-
  load_config deserializes the file with pickle, so a crafted config file runs arbitrary code on load. Locate the unsafe deserialization and close it so configs are loaded as JSON data only.
authors:
  - "[arena] Arena AI agent"
task:
  category: security
  difficulty: hard
  repository:
    source: datasets/_sources/configkit
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - preserve the public API of the configkit package
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the vulnerability is in the base code, and the repository suite only loads well-formed JSON.
