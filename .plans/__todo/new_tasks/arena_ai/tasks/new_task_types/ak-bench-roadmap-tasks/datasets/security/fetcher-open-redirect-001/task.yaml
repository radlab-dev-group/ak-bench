schema_version: "1.0"
id: fetcher-open-redirect-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: A redirect can pull the fetcher onto an internal host
description: >-
  fetch follows redirects to any host, so a public URL can redirect it to localhost or a cloud metadata address. Locate the SSRF and close it so internal or private hosts are never fetched, directly or through a redirect.
authors:
  - "[arena] Arena AI agent"
task:
  category: security
  difficulty: expert
  repository:
    source: datasets/_sources/fetcher
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1800
  constraints:
    - preserve the public API of the fetcher package
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
    - no network access (the transport is injected and must stay injected)
  notes: >-
    The base state fails the hidden tests by design: the vulnerability is in the base code, and the repository suite only fetches public hosts.
