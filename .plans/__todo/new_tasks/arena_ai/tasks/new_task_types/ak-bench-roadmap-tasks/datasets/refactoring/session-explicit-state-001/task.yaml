schema_version: "1.0"
id: session-explicit-state-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Move the global session state into an explicit Session class
description: >-
  Session state lives in module globals shared by every caller. Refactor it into session.store.Session, keeping the module functions working through a default session.
authors:
  - "[arena] Arena AI agent"
task:
  category: refactoring
  difficulty: medium
  repository:
    source: datasets/_sources/session
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 600
  constraints:
    - preserve the public API of the session package (login/logout/add_to_cart/cart_total keep working)
    - do not modify the repository test suite under tests/
    - do not change the session behaviour
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the target module does not exist yet, and the hidden tests import it.
