schema_version: "1.0"
id: config-cache-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Cache the config file instead of re-reading it every call
description: >-
  load_config re-reads and re-parses the file on every call. Add configkit.cache.load_config_cached that parses once and reloads only when the file changes.
authors:
  - "[arena] Arena AI agent"
task:
  category: performance
  difficulty: hard
  repository:
    source: datasets/_sources/configkit
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - preserve the public API of the configkit package (load_config keeps working)
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The hidden tests count json.loads calls: repeated calls on an unchanged file must parse once, and a changed file must be re-parsed.
