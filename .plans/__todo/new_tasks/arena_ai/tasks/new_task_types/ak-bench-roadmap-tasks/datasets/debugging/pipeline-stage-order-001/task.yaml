schema_version: "1.0"
id: pipeline-stage-order-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: A retried pipeline runs its early stages twice
description: >-
  When a middle stage fails once and then succeeds, the stages before it run again on the retry, so their side effects happen twice. Diagnose the failing scenario and repair the retry so it resumes at the failed stage.
authors:
  - "[arena] Arena AI agent"
task:
  category: debugging
  difficulty: hard
  repository:
    source: datasets/_sources/pipeline
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - preserve the public API of the pipeline package
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the defect is in the base code, and the repository suite never fails a stage.
