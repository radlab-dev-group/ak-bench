schema_version: "1.0"
id: quiz-streak-tests-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Write tests that pin the streak bonus threshold
description: >-
  Write a pytest suite for quiz.scoring.score_attempt in tests/test_scoring_agent.py that passes on the current code and fails when the streak bonus starts one answer too early.
authors:
  - "[arena] Arena AI agent"
task:
  category: testing
  difficulty: medium
  repository:
    source: datasets/_sources/quiz
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 600
  constraints:
    - write the tests in tests/test_scoring_agent.py
    - do not modify the implementation under src/
    - do not modify the existing tests under tests/
    - do not add third-party dependencies
  notes: >-
    The hidden harness runs the agent's tests against the correct code (must pass) and a mutated threshold that pays the bonus from the second correct answer (must fail).
