id: syncer-conflict-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: A timestamp tie resolves to the local copy instead of the server
description: >-
  When local and remote versions carry the same timestamp, the local copy wins, but the server is authoritative and the remote version should win the tie. Diagnose the failing scenario and repair the tie-break.
authors:
  - "[arena] Arena AI agent"
task:
  category: debugging
  difficulty: hard
  repository:
    source: datasets/_sources/syncer
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - preserve the public API of the syncer package
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the defect is in the base code, and the repository suite never ties on the timestamp.
