schema_version: "1.0"
id: reportgen-split-module-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Split the tangled report generator into aggregate, format and io modules
description: >-
  generate mixes summarizing, rendering and writing. Refactor it into reportgen.aggregate, reportgen.format and reportgen.io, keeping generate output identical.
authors:
  - "[arena] Arena AI agent"
task:
  category: refactoring
  difficulty: hard
  repository:
    source: datasets/_sources/reportgen
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - preserve the public API of the reportgen package (generate keeps its signature and output)
    - do not modify the repository test suite under tests/
    - do not change the report format
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the target modules do not exist yet, and the hidden tests import them.
