schema_version: "1.0"
id: cachekit-eviction-001
version: "1.0.0"
created_at: "2026-11-10T18:00:00+01:00"
title: Reading a key does not protect it from eviction
description: >-
  A key that was just read is still evicted as if it had never been used,
  because a successful read does not refresh its recency. Restore the
  documented LRU behaviour: get and put both make a key the most recently
  used one.
authors:
  - "[arena] Arena AI agent"
task:
  category: bug_fix
  difficulty: hard
  repository:
    source: datasets/_sources/cachekit
    ref: HEAD
    notes: standard-library-only seed fixture directory; one regression in the read path
  mutation:
    patch: mutations/mutation-001.patch
    version: "1.0.0"
    verification: hidden_tests
    notes: >-
      A successful get no longer refreshes recency, so a hot key is evicted
      ahead of keys that were only written earlier. The repository suite
      never reads a key and then checks which key was evicted, so only the
      hidden tests prove the defect exists.
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - preserve the public API of the cachekit package
    - do not modify the repository test suite under tests/
    - do not change the capacity rule or the eviction order
    - do not add third-party dependencies, threads, or wall-clock time
