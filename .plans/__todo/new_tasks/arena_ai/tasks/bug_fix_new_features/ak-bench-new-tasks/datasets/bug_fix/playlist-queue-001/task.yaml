schema_version: "1.0"
id: playlist-queue-001
version: "1.0.0"
created_at: "2026-11-10T18:00:00+01:00"
title: Disc two plays before disc one finishes
description: >-
  On a multi-disc album the queue interleaves the discs by track number,
  so disc two's opening track plays before disc one's later tracks. Restore
  the documented album order: disc first, then track number within the
  disc.
authors:
  - "[arena] Arena AI agent"
task:
  category: bug_fix
  difficulty: hard
  repository:
    source: datasets/_sources/playlist
    ref: HEAD
    notes: standard-library-only seed fixture directory; one regression in the album-order key
  mutation:
    patch: mutations/mutation-001.patch
    version: "1.0.0"
    verification: hidden_tests
    notes: >-
      The album-order key swapped disc and track number, so tracks are
      ordered by track number across the whole album instead of disc by
      disc. The repository suite only uses single-disc albums, where the
      swap is invisible, so only the hidden tests prove the defect exists.
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - preserve the public API of the playlist package
    - do not modify the repository test suite under tests/
    - do not change the track record or the duration arithmetic
    - do not add third-party dependencies
