schema_version: "1.0"
id: garden-watering-001
version: "1.0.0"
created_at: "2026-11-10T18:00:00+01:00"
title: A plant is not due on its due day
description: >-
  A plant whose due day is today is reported as not needing water, so it
  is watered a day late. Restore the documented inclusive due day, keeping
  the rain postponement as it is.
authors:
  - "[arena] Arena AI agent"
task:
  category: bug_fix
  difficulty: medium
  repository:
    source: datasets/_sources/garden
    ref: HEAD
    notes: standard-library-only seed fixture directory; one regression in the due-day comparison
  mutation:
    patch: mutations/mutation-001.patch
    version: "1.0.0"
    verification: hidden_tests
    notes: >-
      The inclusive due-day comparison became exclusive, so a plant needs
      water only from the day after its due day. The repository suite never
      asks about the due day itself, so only the hidden tests prove the
      defect exists.
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 600
  constraints:
    - preserve the public API of the garden package
    - do not modify the repository test suite under tests/
    - do not change the due-day arithmetic or the rain rule
    - do not add third-party dependencies
