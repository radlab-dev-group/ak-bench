[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ak-bench"
version = "0.1.0"
description = "Agentic Knowledge Benchmark - repeatabalna ocena agentow programistycznych, routerow LLM, modeli i pluginow"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "radlab.dev" }]
dependencies = [
    "alembic>=1.14",
    "jinja2>=3.1",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
akbench = "akbench.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/akbench"]

[tool.hatch.build.targets.wheel.force-include]
"src/akbench/storage/migrations" = "akbench/storage/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that touch the filesystem or a real SQLite database",
    "live: tests that run the real Codex CLI against the LLM router (set AKBENCH_RUN_LIVE=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]
