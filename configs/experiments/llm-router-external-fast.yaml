# Two configurations on two tasks, against the router this installation shares
# (plan section 25, the comparison the operator asked for, cut to its cheapest
# useful shape).
#
# NO KNOWLEDGE AXIS HERE. The toggle lives in the router process, and a shared
# instance neither accepts nor reports a per-run write of it
# (docs/ROUTER_INTEGRATION.md), so a knowledge factor on this runtime would
# record a request instead of a difference — which is why the planner refuses
# one. The arms this experiment can honestly hold still are the model ones:
# qwen/Qwen3.8-27B is served as it is, while auto_codex is the routing plugin's
# trigger, so the second arm measures the router deciding.
#
# THE OTHER HALF OF THE QUESTION IS llm-router-selfhost-fast: the same shape on
# an instance AK-Bench starts per run, where the knowledge plugin is loaded and
# enabled in the process and the toggle is therefore a fact about the run. Read
# this config as "the shared router as it stands" and that one as "the same
# comparison with the plugin under control".
schema_version: "1.0"
id: llm-router-external-fast
version: "1.0.0"
title: "FAST RUN: Router models versus Auto Codex, with and without knowledge"
description: >-
  Two specific tasks (stockpile-writeoff-001 and slugify-001) are evaluated across
  two configurations of the shared router: the Qwen3.8-27B model as it is served,
  and the Auto Codex alias, whose requests the routing plugin decides on. The
  matrix is explicit rather than a full product to optimize router time. The
  knowledge toggle is deliberately not a factor here: a shared instance accepts
  no per-run write of it, so it would record a request rather than a difference,
  and llm-router-selfhost-fast is the experiment that measures it on an instance
  the run owns.

experiment:
  type: configuration

  agent:
    id: codex
    version: "1.0.0"
    config:
      sandbox_mode: workspace-write

  execution:
    mode: router
    runtime:
      id: llm-router-external
      lifecycle: external

  dataset:
    filters:
      categories: [ bug_fix, new_feature ]
      task_ids:
        - stockpile-writeoff-001
        - slugify-001

  factors:
    strategy: custom_matrix
    dimensions:
      - id: model
        values: [ qwen/Qwen3.8-27B, auto_codex ]
    baseline:
      model: qwen/Qwen3.8-27B
    combinations:
      - model: qwen/Qwen3.8-27B
      - model: auto_codex

  execution_policy:
    repetitions: 1
    concurrency: 1
    # Must cover the slowest task in the selection: stockpile-writeoff-001 and
    # slugify-001 each declare a 300s timeout, and a bound below a task's own
    # bound would refuse the plan instead of running it.
    timeout_seconds: 300
    retry_infrastructure_errors: 1

  evaluation:
    evaluators: [ pytest_evaluator ]

  metrics:
    - task_success_rate
    - hidden_test_pass_rate
    - execution_time
    - total_tokens

  limits:
    max_runs: 4
