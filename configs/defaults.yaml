# AK-Bench default configuration.
# Override any value with an environment variable: AKBENCH__SECTION__FIELD
#   AKBENCH__LOGGING__LEVEL=DEBUG
#   AKBENCH__DATABASE__URL=sqlite:////tmp/akbench.sqlite
# Connection parameters live in the project .env (see .env.example); they are
# the same AKBENCH_PG_* names scripts/run-postgres.sh uses.
schema_version: 1

paths:
  data_dir: data
  artifacts_dir: data/artifacts
  workspaces_dir: data/workspaces
  runtime_instances_dir: data/runtime_instances
  reports_dir: reports
  descriptors_dir: descriptors
  datasets_dir: datasets
  repositories_dir: data/repositories
  database_file: data/akbench.sqlite
  logs_dir: data/logs

database:
  # Recorded benchmarks go to PostgreSQL by default. "sqlite" writes the
  # paths.database_file SQLite file instead; database.url overrides both.
  backend: postgres
  url: null
  postgres:
    # Defaults of scripts/run-postgres.sh; .env (AKBENCH_PG_*) wins over them.
    host: 127.0.0.1
    port: 5959
    user: akbench
    # No password here, and no default in the code: set AKBENCH_PG_PASSWORD.
    # A credential that ships with the repository is a credential everyone has.
    password: null
    database: akbench
  echo: false
  timeout_seconds: 30

logging:
  level: INFO
  format: console
  to_file: false
  file: data/logs/akbench.log
  max_bytes: 10000000
  backup_count: 5

doctor:
  # Tool names are configured, never hardcoded in the engine.
  required_tools: [git]
  optional_tools: [docker]
  required_packages: [pydantic, typer, sqlalchemy, alembic, jinja2, yaml]
  min_free_disk_mb: 500
