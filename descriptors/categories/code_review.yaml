# Task category (plan section 8.1): the agent reviews a provided change and
# reports the specified defects; the hidden tests judge which defects it found.
schema_version: "1.0"
id: code_review
version: "1.0.0"
title: Code review
description: Identify specified defects in a provided change.

category:
  enabled: true
  difficulties: [easy, medium, hard]
  default_evaluators: [pytest_evaluator]
  task_requirements:
    - repository with a pinned commit
    - annotated review targets
