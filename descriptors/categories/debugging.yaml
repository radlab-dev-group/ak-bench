# Task category (plan section 8.1): a reproducible failure is presented and the
# agent repairs its root cause; the defect lives in the base code rather than in a
# mutation patch.
schema_version: "1.0"
id: debugging
version: "1.0.0"
title: Debugging
description: Diagnose a failing scenario and repair its root cause.

category:
  enabled: true
  difficulties: [easy, medium, hard]
  default_evaluators: [pytest_evaluator]
  task_requirements:
    - repository with a pinned commit
    - reproducible failure
