# Task category (plan section 8.1): the agent restructures the repository toward
# an architectural goal stated by the task; the acceptance criteria are judged by
# the hidden tests.
schema_version: "1.0"
id: architecture
version: "1.0.0"
title: Architecture
description: Restructure a codebase toward a specified architectural goal.

category:
  enabled: true
  difficulties: [hard, expert]
  default_evaluators: [pytest_evaluator]
  task_requirements:
    - repository with a pinned commit
    - architectural acceptance criteria
