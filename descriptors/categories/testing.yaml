# Task category (plan section 8.1): the agent writes the tests; they must pass on
# the code as it is and fail on a mutated variant, judged against hidden reference
# tests.
schema_version: "1.0"
id: testing
version: "1.0.0"
title: Testing
description: Write tests that expose a specified defect or cover a specified area.

category:
  enabled: true
  difficulties: [easy, medium, hard]
  default_evaluators: [pytest_evaluator]
  task_requirements:
    - repository with a pinned commit
    - hidden reference tests
