# Task category (plan section 8.1): a vulnerability is present in the base code
# and the agent closes it without changing the API; hidden tests prove the
# vulnerability is closed.
schema_version: "1.0"
id: security
version: "1.0.0"
title: Security
description: Locate and fix a specified security issue.

category:
  enabled: true
  difficulties: [medium, hard, expert]
  default_evaluators: [pytest_evaluator]
  task_requirements:
    - repository with a pinned commit
    - hidden tests proving the vulnerability is closed
