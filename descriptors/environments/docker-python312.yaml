# The containerised environment of plan 14, declared before it is enforced.
#
# The image and the ceilings are stated so an experiment can already name the
# environment it wants to run in. AK-Bench 0.1.x has no docker sandbox yet, so
# a plan that selects this environment is refused at validation with the reason
# rather than running on the host and recording something false.
schema_version: "1.0"
id: docker-python312
version: "1.0.0"
title: Docker sandbox with Python 3.12
description: >-
  A container per run: Python 3.12, git and the analyser the evaluators call,
  no network, and resource ceilings the container enforces. Declared here so
  the intent is versioned and the gap is explicit: the sandbox itself is not
  implemented, and selecting this environment is an error, not a silent
  fallback to the host.

environment:
  os: linux
  python: "3.12"
  tools:
    - git
    - python
    - pytest
    - ruff
  network: false
  filesystem: workspace
  sandbox: docker
  image: python:3.12-slim
  limits:
    cpus: 4
    memory_mb: 8192
    disk_mb: 10240
    timeout_seconds: 900
