schema_version: "1.0"
id: atlas-property-based-fencing-suite-001
version: "1.0.0"
created_at: "2026-11-12T09:00:00+01:00"
title: Write the stateful suite that catches the four drift defects
description: >-
  The atlas suite covers fencing one call at a time and the four defects of the
  atlas-drift family all slip through. Write a seeded, stateful test suite in
  tests/test_fencing_stateful.py that models the forward-only lease, the equality
  generation check and the writer-identifier tie-break, runs clean on this
  repository, and fails on each of the four drift mutants.
authors:
  - "[agy] gemini-3.8-flash"
task:
  category: testing
  difficulty: hard
  repository:
    source: datasets/_sources/atlas
    ref: HEAD
    notes: >-
      sharded replicated store; the rules the model has to encode are README.md
      rules 4 and 5, SPEC.md 5.1, ADR-0003 and INC-1201 through INC-1204
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - write the suite in tests/test_fencing_stateful.py
    - the suite passes on this repository as it stands, with no skips and no expected failures
    - "the suite is deterministic: seeded, and it finishes in under sixty seconds"
    - do not modify src/, the existing tests, or the configuration defaults
    - do not add third-party dependencies; the standard library random module is enough
  notes: >-
    The base state fails the hidden tests by design: the harness looks for
    tests/test_fencing_stateful.py and runs it against the unmodified store
    (must pass) and against four single-comparison mutants of fencing.py,
    repair.py and storage.py (each must fail). The mutants are applied by the
    harness, not shipped in the repository.
