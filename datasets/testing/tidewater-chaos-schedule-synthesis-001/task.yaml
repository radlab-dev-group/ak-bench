schema_version: "1.0"
id: tidewater-chaos-schedule-synthesis-001
version: "1.0.0"
created_at: "2026-11-12T09:00:00+01:00"
title: Synthesise the schedule that makes three quorum defects fire
description: >-
  Three ways this cluster counts a majority have been weakened, and none of the
  twelve generated schedules in schedules/ notices. Design one deterministic
  chaos schedule that leaves a pair of nodes alone for longer than an election
  takes, and a test around it that is green on the simulator as it stands and
  fails, with a safety violation, on each of the three defects.
authors:
  - "[agy] gemini-3.8-flash"
task:
  category: testing
  difficulty: hard
  repository:
    source: datasets/_sources/tidewater
    ref: HEAD
    notes: >-
      deterministic Raft simulator; schedules are declarative JSON (docs/schedule-spec.md)
      run by tidewater.cluster.Cluster; safety is decided by the invariant monitor
      in src/tidewater/invariants.py, not by the nodes
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - write the schedule in chaos/byzantine-partition.json and the test in tests/test_chaos_schedules.py
    - do not add or edit anything under schedules/ (the corpus is generated and locked by MANIFEST) and do not edit src/, tools/ or traces/
    - the schedule validates with tidewater.schedule.load_schedule, runs at least 1500 ticks, and holds at least three partitions, two heals and one crash
    - the test is green on this repository as it stands, with no skips and no expected failures, and finishes in under five minutes
    - the test drives the cluster through the schedule file, and asserts both that no safety violation is reported and that the cluster commits work
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the harness looks for
    chaos/byzantine-partition.json and tests/test_chaos_schedules.py, runs them
    against the simulator as it stands (must pass) and against three mutants of
    the quorum rules (each must fail). The mutants are applied by the harness to
    a throwaway copy and are never shipped in the repository.
