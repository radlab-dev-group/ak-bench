schema_version: "1.0"
id: depweaver-sat-engine-modularization-001
version: "1.0.0"
created_at: "2026-11-12T09:00:00+01:00"
title: Split the CDCL solver into modules without moving the search
description: >-
  solver.py is the trail, the watched literals, the conflict analysis and the
  VSIDS heuristic in six hundred lines, because they are one algorithm. Split
  it into modules with edges that still point the same way, and the search has
  to come back down exactly the same path: same trail, same learned clauses,
  same lockfile.
authors:
  - "[agy] gemini-3.8-flash"
task:
  category: refactoring
  difficulty: hard
  repository:
    source: datasets/_sources/depweaver
    ref: HEAD
    notes: >-
      standard-library-only resolver seed; src/depweaver/solver.py is the CDCL
      engine, docs/sat-solver-architecture.md is its module map
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - the public import path stays (from depweaver.solver import Activities, Solver, Trail, Watchers, encode, resolve keeps working)
    - the trail, the learned clauses, the conflict and decision counts, and the resulting lockfile are unchanged for every input
    - the repository suite under tests/ stays green and is not modified
    - no module of the engine imports a module that imports it back
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the engine is one file, and
    the hidden tests ask for the modules it is supposed to be made of. The
    behaviour is pinned by golden solver traces and golden lockfiles, because a
    search that takes a different path is a different solver even when both
    answer satisfiable.
