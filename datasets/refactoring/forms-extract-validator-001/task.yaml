schema_version: "1.0"
id: forms-extract-validator-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Extract the duplicated validation into a validation module
description: >-
  The validation rules are copied inline in register_user. Refactor them into forms.validation with validate_name and validate_email, keeping register_user behaviour identical.
authors:
  - "[arena] Arena AI agent"
task:
  category: refactoring
  difficulty: easy
  repository:
    source: datasets/_sources/forms
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 300
  constraints:
    - preserve the public API of the forms package (register_user keeps its signature and results)
    - do not modify the repository test suite under tests/
    - do not change the validation rules themselves
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the target module does not exist yet, and the hidden tests import it.
