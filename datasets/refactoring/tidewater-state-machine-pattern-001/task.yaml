schema_version: "1.0"
id: tidewater-state-machine-pattern-001
version: "1.0.0"
created_at: "2026-11-12T09:00:00+01:00"
title: Split the role branches out of Node into a role hierarchy
description: >-
  Node decides what to do by asking which role it holds, in six places that
  each re-implement the term comparison that guards them all. Move the
  role-specific behaviour into a role hierarchy under src/tidewater/roles/ and
  leave Node as the context that delegates to it, without moving a single
  message in any of the twelve reference traces.
authors:
  - "[agy] gemini-3.8-flash"
task:
  category: refactoring
  difficulty: hard
  repository:
    source: datasets/_sources/tidewater
    ref: HEAD
    notes: >-
      standard-library-only Raft simulator seed; traces/*.digest is the golden
      behaviour of schedules/*.json and tools/reference_traces.py --check
      compares the two
  evaluator:
    - pytest_evaluator
    - command_evaluator
  evaluator_inputs:
    command_evaluator:
      command: ["python", "tools/reference_traces.py", "--check"]
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - the trace of every schedule in schedules/ stays byte-identical, so every reference digest in traces/ still matches
    - the repository suite under tests/ stays green and is not modified
    - preserve the public API of tidewater.node (Node, NodeOptions, FOLLOWER, PRE_CANDIDATE, CANDIDATE, LEADER keep their names and signatures)
    - the role names written into the trace do not change
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: there is no role hierarchy
    to find, and every role decision is an if in src/tidewater/node.py. The
    command evaluator runs the repository's own reference digest check, which is
    the golden test for this task and is green on the base commit.
