schema_version: "1.0"
id: tidewater-joint-consensus-pr-review-001
version: "1.0.0"
created_at: "2026-11-12T09:00:00+01:00"
title: Review the joint-consensus PR before it ships
description: >-
  PR-118 implements joint consensus for tidewater against SPEC.md section 7.
  It is wrong in three places, all of them safety bugs that the test plan in the
  PR description cannot see. Review the diff where it lives in reviews/ and
  write your findings to review_findings.json.
authors:
  - "[agy] gemini-3.8-flash"
task:
  category: code_review
  difficulty: hard
  repository:
    source: datasets/_sources/tidewater
    ref: HEAD
    notes: >-
      the change under review is reviews/PR-118-joint-consensus/diff.patch with
      reviews/PR-118-joint-consensus/PR.md beside it; the contract it has to
      meet is SPEC.md section 7 and docs/adr/ADR-0007
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - write your findings to review_findings.json at the repository root
    - review_findings.json is a JSON object with a findings array of objects carrying title, file, severity, detail and reference
    - do not apply the patch and do not modify src/, tests/, tools/ or reviews/
    - name the rule each finding breaks (SPEC.md 7.x or ADR-0007) in the finding
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: review_findings.json does
    not exist until the agent writes it. The hidden tests grade it against three
    planted defects, require the rule each one breaks to be named, and cap the
    number of findings so that a shotgun review does not score.
