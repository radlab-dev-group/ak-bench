schema_version: "1.0"
id: walqueue-silent-corruption-triage-001
version: "1.0.0"
created_at: "2026-11-12T09:00:00+01:00"
title: A store that opens clean and is one transaction short
description: >-
  A reconciler store died on ENOSPC during a compaction, restarted with no
  errors, and came back one transaction lighter: a task the client had already
  been shown is simply gone. Every frame in the capture is intact, so nothing
  in the store looks wrong. Find which recovery rule the code stopped enforcing,
  fix it, and keep the recoverable case recoverable.
authors:
  - "[agy] gemini-3.8-flash"
task:
  category: debugging
  difficulty: hard
  repository:
    source: datasets/_sources/walqueue
    ref: HEAD
    notes: >-
      segmented write-ahead-log queue with a length-prefixed canonical JSON
      frame format; the store layout, the crash hooks and the torn-tail rule
      are described in README.md, docs/adr and docs/incidents, and the capture
      the ticket is about is under docs/incidents/captures/INC-0004/
  mutation:
    patch: mutations/mutation-001.patch
    version: "1.0.0"
    verification: hidden_tests
    notes: >-
      One argument, in Journal.recover: the torn-tail allowance is granted to
      every segment instead of to the newest one. The repository suite only ever
      tears the segment it appends to, so it stays green, and a store whose
      sealed segment lost its tail is truncated and read as if the transaction
      had never been written.
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - the repository suite under tests/ stays green and is not modified
    - a torn tail in the segment the journal appends to stays a recoverable truncation
    - a sealed segment that ends mid-frame is refused, and refusing it writes nothing to disk
    - preserve the public API of walqueue.Queue and the on-disk frame format (walqueue.codec)
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the shipped build silently
    truncates damaged sealed segments, the repository suite never tears one, and
    the capture under docs/incidents/captures/INC-0004/ is the only artefact
    that shows the loss.
