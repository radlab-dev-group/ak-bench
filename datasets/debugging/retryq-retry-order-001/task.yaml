schema_version: "1.0"
id: retryq-retry-order-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: A failed task jumps the queue instead of going to the back
description: >-
  When two tasks fail in a row, the second failure is taken before the tasks that were already waiting, so a failing task can starve the queue. Diagnose the failing scenario and repair the retry order so failed tasks go to the back.
authors:
  - "[arena] Arena AI agent"
task:
  category: debugging
  difficulty: medium
  repository:
    source: datasets/_sources/retryq
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 600
  constraints:
    - preserve the public API of the retryq package
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the defect is in the base code, and the repository suite never fails two tasks in a row.
