schema_version: "1.0"
id: atlas-drift-001
version: "1.0.0"
created_at: "2026-11-08T11:20:00+01:00"
title: Restore the invariants that a five-module regression breaks in a sharded store
description: >-
  A production Atlas cluster reports lost writes after a rebalance, a fencing
  check that no longer refuses a caller, a recovery that erases committed work,
  a divergence that repair makes permanent, and a counter that advances by two
  per increment. The repository suite is green, so the defects are visible only
  in the cross-module crash and convergence scenarios. Restore the documented
  invariants without changing the wire format, the public API, or the crash
  contract.
authors:
  - "[local] qwen/Qwen3.8-27B"
  - "[local] qwen/Qwen3.8-Flash-Next"
task:
  category: bug_fix
  difficulty: expert
  repository:
    source: datasets/_sources/atlas
    ref: HEAD
    notes: standard-library-only sharded store seed; five cooperating regressions
  mutation:
    patch: mutations/mutation-001.patch
    version: "1.0.0"
    verification: hidden_tests
    notes: >-
      Five independent regressions, one per module: the rebalance routes a
      moved key under the plan it started with, the generation check passes a
      caller that is ahead of the store, the torn-tail repair cuts back past a
      committed transaction, the concurrency tie-break resolves to the
      smallest writer, and the replay window opens at the snapshot's number
      instead of after it.
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - preserve the public API, the wire format, and the crash contract
    - do not change the repository suite, the schema document, or the incident corpus
    - do not add third-party dependencies, threads, or timers
    - "keep the five SPEC invariants: durable COMMIT, CURRENT as publication, exclusive boundary, fencing equality, descending tie-break"
    - the vendored v1 ring and the generated tables are not the write path and must not be "fixed"
