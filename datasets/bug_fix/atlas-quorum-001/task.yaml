schema_version: "1.0"
id: atlas-quorum-001
version: "1.0.0"
created_at: "2026-11-10T00:30:00+01:00"
title: Restore the quorum and convergence rules that two antagonistic pairs of regressions break in a sharded store
description: >-
  A production Atlas cluster accepts writes it should refuse while a replica
  is being retired, reports a shard that will not converge during the same
  retirement, repairs a lagging replica into a version nobody wrote, and lets
  a worker that fell behind take a key's lease sideways. The repository suite
  is green. The four defects come in two pairs whose obvious fixes undo each
  other with the same error, and the rule that resolves each pair is written
  down once, in the documentation, by symptom. Restore the documented rules
  without changing the public API, the wire format, or the crash contract.
authors:
  - "[local] qwen/Qwen3.8-27B"
  - "[local] qwen/Qwen3.8-Flash-Next"
task:
  category: bug_fix
  difficulty: expert
  repository:
    source: datasets/_sources/atlas
    ref: HEAD
    notes: standard-library-only sharded store seed; four cooperating regressions in two antagonistic pairs
  mutation:
    patch: mutations/mutation-001.patch
    version: "1.0.0"
    verification: hidden_tests
    notes: >-
      Four regressions in two pairs. Pair A: the write quorum counts the
      acknowledgment of a retiring replica, and the convergence pass leaves
      the retiring replica out of its participants. Pair B: read repair writes
      the winner forward one generation ahead of itself, and the lease book
      follows a non-forward generation instead of refusing it. The naive fix
      of either half of a pair reproduces the other half's failure signature.
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - preserve the public API, the wire format, and the crash contract
    - do not change the repository suite, the specification, or the decision records and incident notes
    - do not add third-party dependencies, threads, or timers
    - "keep the SPEC invariants: fencing equality, descending tie-break, quorum arithmetic over the configured consistency levels"
    - the vendored v1 ring and the generated tables are not the write path and must not be "fixed"
