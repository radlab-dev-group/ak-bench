schema_version: "1.0"
id: atlas-quorum-003
version: "1.0.0"
created_at: "2026-11-10T00:30:00+01:00"
title: Restore the retiring-replica rule where the rebalance streams from a retiring primary
description: >-
  A production Atlas cluster retires a replica and the keys it was primary
  for are not on their new primary afterwards; a read that loses one more
  replica loses the key. The repository suite is green. The rule that is
  broken is a rule about what a retiring replica still is, and the
  documentation states it once, by symptom. Restore it without changing the
  public API or the order of the rebalance steps.
authors:
  - "[local] qwen/Qwen3.8-27B"
  - "[local] qwen/Qwen3.8-Flash-Next"
task:
  category: bug_fix
  difficulty: expert
  repository:
    source: datasets/_sources/atlas
    ref: HEAD
    notes: standard-library-only sharded store seed; one regression, same invariant as the quorum family in another module
  mutation:
    patch: mutations/mutation-001.patch
    version: "1.0.0"
    verification: hidden_tests
    notes: >-
      One regression: the rebalance skips a movement whose source replica is
      retiring, so the key is never streamed to its new primary. The quorum
      and convergence paths are intact.
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - preserve the public API, the wire format, and the crash contract
    - do not change the repository suite, the specification, or the decision records and incident notes
    - do not add third-party dependencies, threads, or timers
    - "keep the SPEC invariants: fencing equality, descending tie-break, quorum arithmetic over the configured consistency levels"
    - the vendored v1 ring and the generated tables are not the write path and must not be "fixed"
