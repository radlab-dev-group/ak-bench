schema_version: "1.0"
id: atlas-quorum-002
version: "1.0.0"
created_at: "2026-11-10T00:30:00+01:00"
title: Restore the read side of the retiring-replica quorum rule in a sharded store
description: >-
  A production Atlas cluster keeps answering reads while two of a key's three
  replicas are being retired, and the answers it gives are the ones the
  retiring replicas hold. The repository suite is green. One rule of the
  store is broken on one branch of one path; the documentation states the
  rule once, by symptom. Restore it without changing the public API.
authors:
  - "[local] qwen/Qwen3.8-27B"
  - "[local] qwen/Qwen3.8-Flash-Next"
task:
  category: bug_fix
  difficulty: expert
  repository:
    source: datasets/_sources/atlas
    ref: HEAD
    notes: standard-library-only sharded store seed; one regression, exact signature of the quorum family
  mutation:
    patch: mutations/mutation-001.patch
    version: "1.0.0"
    verification: hidden_tests
    notes: >-
      One regression: the read path counts the answer of a retiring replica
      toward the read quorum. The write side of the same rule is intact.
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - preserve the public API, the wire format, and the crash contract
    - do not change the repository suite, the specification, or the decision records and incident notes
    - do not add third-party dependencies, threads, or timers
    - "keep the SPEC invariants: fencing equality, descending tie-break, quorum arithmetic over the configured consistency levels"
    - the vendored v1 ring and the generated tables are not the write path and must not be "fixed"
