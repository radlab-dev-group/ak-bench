schema_version: "1.0"
id: quiz-streak-001
version: "1.0.0"
created_at: "2026-11-10T18:00:00+01:00"
title: The streak bonus starts one answer too early
description: >-
  The second consecutive correct answer already earns the streak bonus, so
  every attempt with two correct answers in a row is over-scored. Restore
  the documented threshold: the bonus starts at the third consecutive
  correct answer.
authors:
  - "[arena] Arena AI agent"
task:
  category: bug_fix
  difficulty: medium
  repository:
    source: datasets/_sources/quiz
    ref: HEAD
    notes: standard-library-only seed fixture directory; one regression in the streak threshold
  mutation:
    patch: mutations/mutation-001.patch
    version: "1.0.0"
    verification: hidden_tests
    notes: >-
      The streak threshold dropped from three to two, so the bonus is paid
      from the second consecutive correct answer onward. The repository
      suite never scores two correct answers in a row, so only the hidden
      tests prove the defect exists.
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 600
  constraints:
    - preserve the public API of the quiz package
    - do not modify the repository test suite under tests/
    - do not change the bonus amount or the question points
    - do not add third-party dependencies
