schema_version: "1.0"
id: atlas-vector-clock-forge-001
version: "1.0.0"
created_at: "2026-11-12T09:00:00+01:00"
title: A returning worker takes a lease sideways and nobody stops it
description: >-
  A worker that was cut off mid-write comes back and commits the write it was
  holding at a generation the lease already records. The take-over is accepted,
  the lease changes hands without moving forward, and the next ordinary write
  is refused for a reason nobody can read off the lease. Close the hole in the
  fencing check without touching the wire contract or the read-repair path.
authors:
  - "[agy] gemini-3.8-flash"
task:
  category: security
  difficulty: hard
  repository:
    source: datasets/_sources/atlas
    ref: HEAD
    notes: >-
      sharded replicated store; the fencing checks of the write path live in
      src/atlas/fencing.py and their contract is written down in SPEC.md rule 4,
      ADR-0003 (a version is minted once) and INC-1204 (a lease that walked
      backwards)
  mutation:
    patch: mutations/mutation-001.patch
    version: "1.0.0"
    verification: hidden_tests
    notes: >-
      One character of one comparison, in FenceBook.advance_lease: the
      forward-only check stops refusing a generation equal to the one on record.
      The repository suite never replays a take-over at the generation it lost,
      so it stays green while a stale worker can take a lease sideways.
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - the repository suite under tests/ stays green and is not modified
    - a take-over strictly ahead of the recorded generation is still granted
    - a released key can be granted again at any generation, including the one it lost
    - the strict and permissive generation_check modes keep the behaviour SPEC.md describes
    - public signatures in atlas.fencing (grant, lease, release, check_write, advance_lease) are unchanged
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the shipped fence lets a
    worker take a lease at the generation another worker already holds, which is
    the INC-1204 regression, and no test in the repository suite replays that
    take-over.
