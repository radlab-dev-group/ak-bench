schema_version: "1.0"
id: shopdb-sql-injection-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: A user name can rewrite the lookup query
description: >-
  find_users interpolates the name into the SQL string, so a name like ' OR '1'='1 returns every user. Locate the injection and close it so the name is always looked up literally.
authors:
  - "[arena] Arena AI agent"
task:
  category: security
  difficulty: medium
  repository:
    source: datasets/_sources/shopdb
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 600
  constraints:
    - preserve the public API of the shopdb package
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the vulnerability is in the base code, and the repository suite never looks up a name with quotes or SQL syntax.
