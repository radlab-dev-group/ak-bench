schema_version: "1.0"
id: authkit-token-timing-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: A token with the right prefix is accepted
description: >-
  check_token accepts any token that starts with the expected one, so a longer token sharing the prefix authenticates. Locate the flaw and close it so only the exact token is accepted, compared in constant time.
authors:
  - "[arena] Arena AI agent"
task:
  category: security
  difficulty: hard
  repository:
    source: datasets/_sources/authkit
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - preserve the public API of the authkit package
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The base state fails the hidden tests by design: the vulnerability is in the base code, and the repository suite never presents a token with extra characters.
