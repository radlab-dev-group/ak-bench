schema_version: "1.0"
id: atlas-schema-001
version: "1.0.0"
created_at: "2026-11-10T00:30:00+01:00"
title: "Implement schema evolution: read legacy rows forward, serve pinned readers back, and lock the generated tables"
description: >-
  Atlas is a sharded, replicated, fenced key-value store. Its write, read,
  recovery, and rebalance paths are complete and their suite is green. One
  feature is declared and not implemented: schema evolution of stored rows.
  Two older row layouts exist on disk; the contract in SPEC.md section 10
  says how a reader upgrades them on read, how a migration dual-writes for a
  reader pinned to an older layout, what a downgrade must preserve, and how
  every step is registered. The layouts are declared in the schema document
  and reach the code only through the generated tables, so the feature is
  also a change to the schema and must follow the repository's procedure for
  one. The hidden tests read large legacy fixtures and check the procedure's
  artefacts, not only the code.
authors:
  - "[local] qwen/Qwen3.8-27B"
  - "[local] qwen/Qwen3.8-Flash-Next"
task:
  category: new_feature
  difficulty: expert
  repository:
    source: datasets/_sources/atlas
    ref: HEAD
    notes: standard-library-only sharded store seed; schema evolution declared, not implemented
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - implement the complete SPEC.md section 10 contract for the records row layouts without changing the public API
    - rows on disk are upgraded on read and never rewritten; a reader pinned to an older layout is served downgraded rows
    - "the frame bytes are produced by atlas.codec and its canonical form is frozen: a legacy frame must survive the trip up to the current layout and back byte for byte"
    - the layouts are declared in schema/tables.json and reach the code only through the generated module; follow the documented procedure for a schema change and leave its artefacts in the tree
    - do not modify the repository suite, the incident corpus, the goldens' source rows, or the stub's public surface
    - do not add third-party dependencies, threads, or timers
    - a second installation of the upgraders into the same registry registers nothing and raises nothing
