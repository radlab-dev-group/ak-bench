# New-feature task: the search function.
#
# The fixture is a real, working Flask note store (the seed directory is cached
# with a fixed identity, so the pinned commit is reproducible without a
# remote). search_notes is declared, documented in its module, and unimplemented;
# the hidden tests fail on the base commit by design, the opposite of the bug-
# fix convention.
schema_version: "1.0"
id: notes-search-001
version: "1.0.0"
title: Implement search_notes from its specification
description: >-
  search_notes is declared and specified in src/notesapi/search.py but raises
  NotImplementedError. Implement it from the written contract, keeping the store
  and its tests intact.

task:
  category: new_feature
  difficulty: hard

  repository:
    source: datasets/_sources/notesapi
    ref: HEAD
    notes: seed fixture directory

  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 600
  constraints:
    - do not change the public API of the notesapi package
    - do not modify the repository test suite under tests/
    - do not change the store or the error types
    - do not add third-party dependencies
    - do not modify the search spec in the module docstring
  notes: >-
    The base state fails the hidden tests by design: the feature is missing,
    which is the opposite of the bug-fix convention where hidden tests pass on
    the base commit.
