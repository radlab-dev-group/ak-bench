[project]
name = "tidewater"
version = "1.0.0"
description = "Tidewater: a deterministic discrete-event simulator of a replicated log (benchmark seed)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tidewater = "tidewater.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
