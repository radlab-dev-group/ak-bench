schema_version: "1.0"
id: inverted-index-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Build an inverted index for document search
description: >-
  search scans every document for every query. Add searchkit.index with build_index and search so queries answer from the index alone.
authors:
  - "[arena] Arena AI agent"
task:
  category: performance
  difficulty: expert
  repository:
    source: datasets/_sources/searchkit
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - preserve the public API of the searchkit package (search keeps working)
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The hidden tests prove search answers from the index alone: it works after the documents are gone and reflects index mutations.
