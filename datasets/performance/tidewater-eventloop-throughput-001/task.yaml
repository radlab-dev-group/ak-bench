schema_version: "1.0"
id: tidewater-eventloop-throughput-001
version: "1.0.0"
created_at: "2026-11-12T09:00:00+01:00"
title: Make a hundred thousand ticks cost a third less without moving the trace
description: >-
  A 2000-tick five-node run spends more than four fifths of its time inside the
  invariant monitor, and the monitor is doing the same pairwise log walk on
  every tick for nodes whose logs did not change. Profile it, make the
  per-tick work proportional to what happened, and keep every byte of the trace
  where it is.
authors:
  - "[agy] gemini-3.8-flash"
task:
  category: performance
  difficulty: expert
  repository:
    source: datasets/_sources/tidewater
    ref: HEAD
    notes: >-
      standard-library-only Raft simulator seed; tools/bench.py measures a run
      and traces/*.digest pins what a run produces
  evaluator:
    - pytest_evaluator
    - command_evaluator
  evaluator_inputs:
    command_evaluator:
      command: ["python", "tools/reference_traces.py", "--check"]
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 10800
  constraints:
    - the trace of every schedule in schedules/ stays byte-identical, so every reference digest in traces/ still matches
    - the safety invariants stay enabled and still fire on a broken cluster; a run is not faster by not being checked
    - the repository suite under tests/ stays green and is not modified
    - the public API of tidewater (Cluster, InvariantMonitor, RaftLog, EventQueue) is preserved
    - do not add third-party dependencies, threads, timers, caching across runs or memoisation of a whole simulation
  notes: >-
    The hidden harness times the workspace against a pristine copy of the seed
    kept inside the task, in the same process family and with the same
    measurement, so the target is a ratio and not a wall-clock number. The
    command evaluator runs the repository's own reference digest check, which is
    the correctness half of the task and is green on the base commit.
