schema_version: "1.0"
id: fib-memo-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Memoize the Fibonacci recursion
description: >-
  fib recomputes every subproblem exponentially. Add fibkit.memo.fib with memoization that returns the same values in linear time.
authors:
  - "[arena] Arena AI agent"
task:
  category: performance
  difficulty: hard
  repository:
    source: datasets/_sources/fibkit
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 1200
  constraints:
    - preserve the public API of the fibkit package (fib keeps working)
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The hidden tests count fib function calls with sys.setprofile: the naive recursion needs millions for fib(30), the memoized one dozens.
