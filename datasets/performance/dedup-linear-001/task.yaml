schema_version: "1.0"
id: dedup-linear-001
version: "1.0.0"
created_at: "2026-11-10T19:00:00+01:00"
title: Make the deduplication linear
description: >-
  unique is quadratic: every item is compared against every kept item. Rewrite it to run in linear time while keeping first-occurrence order.
authors:
  - "[arena] Arena AI agent"
task:
  category: performance
  difficulty: medium
  repository:
    source: datasets/_sources/dedupkit
    ref: HEAD
    notes: standard-library-only seed fixture directory
  evaluator: pytest_evaluator
  hidden_tests: hidden_tests
  public_tests: public_tests
  timeout_seconds: 600
  constraints:
    - preserve the public API of the dedupkit package (unique keeps its signature and results)
    - do not modify the repository test suite under tests/
    - do not add third-party dependencies
  notes: >-
    The hidden tests count equality comparisons on instrumented items: a quadratic implementation needs thousands, a linear one a few hundred.
